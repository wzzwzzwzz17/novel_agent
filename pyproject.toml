[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent"
version = "0.1.0"
description = "Portable novel-writing agent. Cloud uses an OpenAI-compatible API; a local model, if any, is a separate HTTP server."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "雨里百跳" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "responses>=0.25"]

[project.scripts]
novel-agent = "novel_agent.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
