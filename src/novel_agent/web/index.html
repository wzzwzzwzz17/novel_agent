<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NovelAgent</title>
  <link rel="stylesheet" href="/assets/style.css?v=4" />
</head>
<body>
  <header class="top">
    <button id="btnPanel" type="button" class="ghost menu-btn" aria-expanded="false" aria-controls="sheet">设定</button>
    <div class="brand">
      <strong>NovelAgent</strong>
      <span id="health" class="muted">连接中</span>
    </div>
    <span id="localSpeed" class="speed">云端 API</span>
    <button id="btnNew" type="button" class="ghost head-btn">新建</button>
  </header>

  <div class="layout">
    <aside id="sheet">
      <div class="sheet-head">
        <div>
          <strong>创作设定</strong>
          <p class="muted">会话、角色、记忆与接口</p>
        </div>
        <button id="btnClosePanel" type="button" class="ghost head-btn">完成</button>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="session">会话</button>
        <button type="button" class="tab" data-tab="chars">角色</button>
        <button type="button" class="tab" data-tab="memory">记忆</button>
        <button type="button" class="tab" data-tab="params">参数</button>
        <button type="button" class="tab" data-tab="plugins">插件</button>
      </div>

      <section class="panel active" id="panel-session">
        <ul id="sessionList"></ul>
        <h3>总纲</h3>
        <textarea id="outline" rows="8" placeholder="世界观 / 主线 / 禁忌…"></textarea>
        <button id="btnSaveOutline" type="button">保存总纲</button>
        <p id="outlineStatus" class="muted"></p>
        <h3>NovelRef</h3>
        <select id="refTag"><option value="">不使用参考</option></select>
        <input id="sceneKw" placeholder="场景词，逗号分隔" />
        <button id="btnProbeRef" type="button" class="ghost">探测参考（不续写）</button>
      </section>

      <section class="panel" id="panel-chars">
        <p id="charCount" class="muted">本会话角色卡：0</p>
        <ul id="charList" class="card-list"></ul>
        <div class="row">
          <button id="btnNewChar" type="button" class="ghost">新建角色卡</button>
          <button id="btnSaveLib" type="button" class="ghost">存入角色库</button>
        </div>
        <label>从角色库导入
          <select id="libSelect"><option value="">（空）</option></select>
        </label>
        <button id="btnImportLib" type="button" class="ghost">导入到本会话</button>
        <input id="charName" placeholder="角色名" />
        <textarea id="charRaw" rows="5" placeholder="原始人设描述…"></textarea>
        <div class="row">
          <button id="btnAddChar" type="button">保存角色</button>
          <button id="btnOptChar" type="button" class="ghost">一键优化</button>
        </div>
        <textarea id="charOpt" rows="6" placeholder="优化后人设（可手改）" readonly></textarea>
        <label class="check"><input type="checkbox" id="charActive" checked /> 活跃注入</label>
      </section>

      <section class="panel" id="panel-memory">
        <h3>全局摘要</h3>
        <textarea id="memSummary" rows="5" placeholder="全局剧情摘要…"></textarea>
        <button id="btnSaveSummary" type="button">保存摘要</button>
        <h3>事件记忆</h3>
        <ul id="eventList"></ul>
        <textarea id="eventContent" rows="2" placeholder="新事件…"></textarea>
        <select id="eventWeight">
          <option value="high">high</option>
          <option value="medium" selected>medium</option>
          <option value="low">low</option>
        </select>
        <button id="btnAddEvent" type="button">添加事件</button>
      </section>

      <section class="panel" id="panel-params">
        <h3>DeepSeek API</h3>
        <p id="apiKeyStatus" class="muted">尚未配置 API Key</p>
        <label>接口地址 <input id="apiBase" placeholder="https://api.deepseek.com/v1" /></label>
        <label>模型 <input id="apiModel" placeholder="deepseek-chat" /></label>
        <label>API Key <input id="apiKey" type="password" autocomplete="off" placeholder="sk-… 留空表示不修改" /></label>
        <button id="btnSaveApi" type="button">保存 API Key</button>
        <h3>生成</h3>
        <div class="grid-2">
          <label>temperature <input id="cfgTemp" type="number" step="0.05" min="0" max="2" /></label>
          <label>top_p <input id="cfgTopP" type="number" step="0.05" min="0" max="1" /></label>
          <label>单次最多字数 <input id="cfgMaxTok" type="number" step="200" min="200" max="12000" /></label>
          <label>recent_turns <input id="cfgTurns" type="number" step="1" min="2" max="40" /></label>
        </div>
        <label>最少回复字数 <input id="cfgMinChars" type="number" step="100" min="0" max="8000" /></label>
        <div class="checks">
          <label class="check"><input type="checkbox" id="cfgRef" /> 启用 NovelRef</label>
          <label class="check"><input type="checkbox" id="cfgMem" /> 自动记忆提取</label>
          <label class="check"><input type="checkbox" id="cfgOoc" /> OOC 提示</label>
          <label class="check"><input type="checkbox" id="streamMode" checked /> 流式输出</label>
        </div>
        <button id="btnSaveCfg" type="button">保存参数</button>
      </section>

      <section class="panel" id="panel-plugins">
        <p class="muted">把带 manifest.json 的文件夹放进 novel_agent/plugins 或数据目录 plugins，即可加载。启用后会注入续写提示词。</p>
        <ul id="pluginList" class="card-list"></ul>
      </section>
    </aside>

    <main>
      <div id="chat" class="chat"></div>
      <div class="dock">
        <div id="oocBox" class="ooc hidden"></div>
        <div class="composer">
          <textarea id="instruction" rows="2" placeholder="写下这一段要发生什么"></textarea>
          <div class="composer-actions">
            <button id="btnWrite" type="button"><span class="long">全自动续写</span><span class="short">续写</span></button>
            <button id="btnRegen" type="button" class="ghost"><span class="long">重新生成</span><span class="short">重写</span></button>
            <button id="btnPause" type="button" class="ghost" disabled><span class="long">暂停生成</span><span class="short">暂停</span></button>
          </div>
        </div>
        <details id="refPanel">
          <summary>工具 / 参考 / 记忆日志</summary>
          <pre id="refLog"></pre>
        </details>
      </div>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/assets/app.js?v=9"></script>
</body>
</html>
